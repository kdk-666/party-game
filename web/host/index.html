<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="/static/guide.css">
<link rel="stylesheet" href="/static/lobby.css">

<title>미정</title>
<body id="bg" style="font-family:sans-serif;text-align:center;transition:background .2s">
<h1 class="brand">미정</h1>
<p class="brand-caption"></p>

<main id="host-waiting" class="host-waiting">
  <section id="lobby" class="lobby-card qr-card">
    <p class="lobby-kicker">JOIN THE PARTY</p>
    <h2>휴대폰으로 참가하기</h2>
    <p>카메라로 QR 코드를 스캔해 주세요.</p>
    <div class="qr-box"><img id="qr" width="250" alt="참가 페이지 QR 코드"></div>
    <p id="url"></p>
  </section>

  <section class="lobby-card">
    <p class="lobby-kicker">PLAYER LOBBY</p>
    <h2>참가자</h2>
    <p id="lobby-count" class="lobby-count">0 / 4명 참가 중</p>
    <ul id="lobby-players" class="lobby-slots"></ul>
    <button id="start" class="lobby-button" disabled>게임 시작</button>
    <p id="host-connection" class="lobby-footnote">서버에 연결하고 있어요.</p>
  </section>
</main>

<main id="host-game" class="host-game" hidden>
  <h1 id="status"></h1>
  <h2>참가자 (술래까지 거리)</h2>
  <div id="list" style="width:70%;margin:auto;font-size:22px;text-align:left"></div>
  <h2>게임 순위</h2>
  <div id="ranking" style="font-size:22px;white-space:pre-line"></div>
  <button id="host-back" class="lobby-button host-back" hidden>대기실로 돌아가기</button>
</main>
<div id="game-guide" class="guide-overlay" hidden>
  <section class="guide-card" role="dialog" aria-labelledby="guide-title">
    <p id="guide-round" class="guide-kicker"></p>
    <h2 id="guide-title"></h2>
    <p class="guide-timer">시작까지 <strong id="guide-time">60</strong>초</p>
    <ol id="guide-rules" class="guide-rules"></ol>
    <p id="guide-summary" class="guide-summary" aria-live="polite"></p>
    <ul id="guide-players" class="guide-players"></ul>
    <p id="guide-hint" class="guide-hint">참가자 전원이 준비하면 바로 시작해요.</p>
  </section>
</div>
<link rel="stylesheet" href="/static/colorhunt.css">
<div id="ch-screen" class="ch-screen" hidden></div>
<script src="/static/guide.js"></script>
<script src="/static/colorhunt.js"></script>
<script src="/static/host-lobby.js"></script>
<script>
const joinUrl = location.origin + "/play";
document.getElementById("qr").src = "/qr.svg?url=" + encodeURIComponent(joinUrl);
document.getElementById("url").textContent = joinUrl;

const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
const ws = new WebSocket("wss://" + location.host + "/ws/host");
setupGameGuide(ws, () => null);
setupColorHunt(ws, "host", () => null);
setupHostLobby(ws);
const bg = document.getElementById("bg");
const status = document.getElementById("status");
const rankingEl = document.getElementById("ranking");
const list = document.getElementById("list");
let names = [], alive = null, dist = {};
const START = 10;

function draw() {
  list.innerHTML = names.map(n => {
    const dead = alive && !alive.includes(n);
    const d = dist[n] !== undefined ? dist[n] : START;
    const pct = Math.max(0, Math.min(100, (START - d) / START * 100));
    return "<div style='margin:8px 0;" + (dead ? "color:#999" : "") + "'>" + esc(n) +
      " — " + d.toFixed(1) + "m" + (dead ? " (정지)" : "") +
      "<div style='background:#ddd;height:18px;border-radius:9px'>" +
      "<div style='background:" + (dead ? "#999" : "#3b82f6") + ";height:18px;border-radius:9px;width:" + pct + "%'></div></div></div>";
  }).join("");
}

document.getElementById("start").onclick = () => ws.send(JSON.stringify({type: "start", data: {}}));

ws.onmessage = (e) => {
  const msg = JSON.parse(e.data), d = msg.data;
  if (msg.type === "lobby") { names = d.players; draw(); }
  else if (msg.type === "countdown") {
    rankingEl.textContent = "";
    alive = null; dist = {}; bg.style.background = "#fff"; status.textContent = "준비하세요! 3초 후 시작"; draw();
  } else if (msg.type === "state") {
    alive = d.alive; draw();
    bg.style.background = d.state === "green" ? "#7bd88f" : "#ff6b6b";
    status.textContent = d.state === "green" ? "🟢 초록불: 흔들어서 앞으로!" : "🔴 빨간불: 멈춰!";
  } else if (msg.type === "dist") { dist = d.dist; alive = d.alive; draw(); }
  else if (msg.type === "eFliminated") { alive = d.alive; draw(); }
  else if (msg.type === "game_cancelled") {
  bg.style.background = "#fff";
  status.textContent = "참가자가 모두 나가 게임이 취소됐습니다.";
}
  else if (msg.type === "game_over") {
  dist = d.dist;
  draw();
  bg.style.background = "#fff";

  status.textContent = "🏆 우승: " + d.winner +
    (d.arrived.length ? " (도착!)" : " (가장 가까이 감)");

  rankingEl.textContent = (d.ranking || [])
    .map((name, index) => (index + 1) + "등: " + name)
    .join("\n");
}
};
</script>
